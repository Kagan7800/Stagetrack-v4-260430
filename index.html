<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Fun With My Little One</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
    <script>
      (function() {
        var p = (window.location.pathname || '').toLowerCase();
        var h = (window.location.hash || '').toLowerCase();
        var s = (window.location.search || '').toLowerCase();
        var isSurvey = p.includes('about-your-little-one') || p.includes('profile-generator') || p.includes('profile-builder') || p.includes('survey') || p.includes('profile') || p.includes('explanation') || h.includes('profile') || h.includes('survey') || s.includes('profile') || s.includes('survey');
        if (isSurvey) {
          document.documentElement.style.backgroundColor = '#D9EFFF';
          document.documentElement.style.background = '#D9EFFF';
        } else {
          document.documentElement.style.backgroundColor = '#1745B9';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
