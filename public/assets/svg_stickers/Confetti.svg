<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Balanced, Airy Confetti Scatter (Reduced by 10%) -->
  <defs>
    <polygon id="c-star" points="0,-7 2.1,-2.1 7.3,-2.1 3.1,1.1 4.7,6.3 0,3.1 -4.7,6.3 -3.1,1.1 -7.3,-2.1 -2.1,-2.1" />
    <polygon id="c-diamond" points="0,-8 5.5,0 0,8 -5.5,0" />
  </defs>

  <g id="confettiScatter">
    <!-- Ribbons -->
    <rect x="75" y="80" width="9" height="16" rx="2" fill="#FFD700" transform="rotate(25 79 88)" />
    <rect x="360" y="160" width="10" height="17" rx="2" fill="#00E5FF" transform="rotate(45 365 168)" />
    <rect x="220" y="420" width="8" height="15" rx="2" fill="#FF1493" transform="rotate(-35 224 427)" />

    <!-- Stars -->
    <use href="#c-star" x="480" y="90" fill="#FFD700" transform="rotate(15 480 90)" />
    <use href="#c-star" x="150" y="270" fill="#FFEE58" transform="rotate(-20 150 270)" />
    <use href="#c-star" x="420" y="470" fill="#E040FB" transform="rotate(35 420 470)" />

    <!-- Diamonds -->
    <use href="#c-diamond" x="270" y="60" fill="#2979FF" transform="rotate(20 270 60)" />
    <use href="#c-diamond" x="500" y="320" fill="#FF6D00" transform="rotate(-30 500 320)" />

    <!-- Circles / Dots -->
    <circle cx="80" cy="460" r="5" fill="#FF1744" />
    <circle cx="340" cy="330" r="5" fill="#00E676" />
  </g>
</svg>